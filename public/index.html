<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <title>GyanAI — अपना AI बनाएं</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body class="landing-body">
  <div class="landing">
    <div class="landing-card" id="createCard">
      <div class="logo-big">
        <span class="spark">✦</span>
        <span>Gyan<span class="blue">AI</span></span>
      </div>
      <h1>अपना AI बनाएं</h1>
      <p class="sub">सिर्फ अपनी ईमेल ID डालें। एक क्लिक में आपका AI तैयार।</p>

      <form id="createForm" autocomplete="off">
        <label class="field-label">ईमेल ID (Username)</label>
        <input type="email" id="emailInput" name="email" required
               placeholder="you@gmail.com" maxlength="160" autofocus>
        <button type="submit" class="btn-primary" id="createBtn">
          Generate AI →
        </button>
      </form>
      <div id="formStatus" class="status"></div>
    </div>

    <!-- Success state -->
    <div class="landing-card hidden" id="successCard">
      <div class="success-icon">✓</div>
      <h1>आपका AI तैयार है!</h1>
      <p class="sub">नीचे दिए लिंक पर क्लिक करें। पूरा AI खुल जाएगा।</p>

      <div class="link-box">
        <a id="aiLink" href="#" target="_blank" rel="noopener" class="ai-link"></a>
      </div>

      <div class="btn-row">
        <button type="button" class="btn-secondary" id="copyBtn">लिंक कॉपी करें</button>
        <a id="openBtn" href="#" class="btn-primary" target="_blank" rel="noopener">AI खोलें →</a>
      </div>
      <p class="tiny">लिंक सुरक्षित रखें। इसी से आपका AI खुलेगा।</p>
    </div>
  </div>

  <script src="/public/app.js"></script>
</body>
</html>
