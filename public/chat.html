<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <title>GyanAI</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    /* यह इनलाइन CSS है जो ब्राउज़र में तुरंत लागू होगा */
    .chat-body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* मोबाइल के लिए सबसे सही */
      margin: 0;
      overflow: hidden;
      background: #f7f9fc;
    }
    .chat-main {
      flex: 1;
      overflow-y: auto; /* सिर्फ मैसेज स्क्रॉल होंगे */
      padding-bottom: 20px;
    }
    .composer-wrap {
      width: 100%;
      background: #f7f9fc;
      padding: 10px;
      box-sizing: border-box;
      /* यह सुनिश्चित करेगा कि बॉक्स नीचे ही रहे */
      flex-shrink: 0; 
      z-index: 9999;
    }
  </style>
</head>
<body class="chat-body">

  <!-- Left Drawer -->
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <strong>☰ मेन्यू</strong>
      <button id="closeDrawer" class="icon-btn">✕</button>
    </div>

    <button id="newChatBtn" class="menu-item">＋ नई चैट</button>

    <div class="drawer-label">हाल की चैट</div>
    <div id="historyList"></div>

    <!-- Owner Settings -->
    <div id="ownerSettings" class="owner-settings hidden">
      <div class="drawer-label">⚙ API सेटिंग्स</div>
      <div class="settings-box">
        <label>Base URL</label>
        <input type="text" id="setUrl" placeholder="https://api.groq.com/openai/v1" autocomplete="off">
        <div id="urlSuggest" class="suggest-list"></div>

        <label>Model</label>
        <input type="text" id="setModel" placeholder="llama-3.3-70b-versatile" autocomplete="off">
        <div id="modelSuggest" class="suggest-list"></div>

        <label>API Key</label>
        <input type="password" id="setKey" placeholder="gsk_... या sk-..." autocomplete="off">

        <div class="set-btns">
          <button type="button" id="testBtn" class="btn-secondary small">टेस्ट</button>
          <button type="button" id="saveSettingsBtn" class="btn-primary small">सेव करें</button>
        </div>
        <div id="settingsStatus" class="status small"></div>
        <p class="hint-tiny">OpenAI-compatible किसी भी API से चलता है (Groq, OpenAI, Grok, Together…)</p>
      </div>
    </div>
  </aside>
  <div id="shade" class="shade hidden"></div>

  <!-- Top Bar -->
  <header class="chat-top">
    <button id="openDrawer" class="icon-btn" aria-label="मेन्यू">☰</button>
    <div class="brand">
      <span class="spark">✦</span>
      <span>Gyan<span class="blue">AI</span></span>
    </div>
    <button id="moreBtn" class="icon-btn" aria-label="विकल्प">⋮</button>
    <div id="moreMenu" class="more-menu hidden">
      <button id="shareBtn">AI लिंक कॉपी करें</button>
      <button id="historyMenuBtn">चैट हिस्ट्री</button>
    </div>
  </header>

  <!-- Main Chat Area -->
  <main class="chat-main" id="chatMain">
    <section id="welcomeCard" class="chat-welcome">
      <h1>नमस्कार! 👋</h1>
      <p>आज मैं आपकी कैसे मदद कर सकता हूँ?</p>
      <div class="creator-line">
        निर्माता: <strong id="creatorName">—</strong>
      </div>
    </section>
    <section id="messages" class="messages"></section>
  </main>

  <!-- FIXED Message Box at bottom -->
  <div class="composer-wrap">
    <form id="chatForm" class="composer" style="display: flex; align-items: center; background: #fff; border: 1px solid #ccc; border-radius: 25px; padding: 5px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
      
      <textarea id="messageInput" rows="1" placeholder="यहाँ मैसेज लिखें..." maxlength="6000" style="flex: 1; border: none; outline: none; resize: none; padding: 10px 0; font-size: 16px; max-height: 100px; background: transparent;"></textarea>
      
      <button type="submit" id="sendBtn" aria-label="भेजें" style="background: #1a73e8; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 10px;">➤</button>
      
    </form>
  </div>

  <!-- Custom Confirm Modal -->
  <div id="confirmModal" class="confirm-overlay hidden">
    <div class="confirm-box">
      <p id="confirmText">यह चैट डिलीट करें?</p>
      <div class="confirm-btns">
        <button type="button" id="confirmCancel" class="btn-secondary small">रद्द करें</button>
        <button type="button" id="confirmOk" class="btn-danger small">डिलीट करें</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/public/app.js"></script>
</body>
          </html>
