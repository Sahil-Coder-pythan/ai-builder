<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0878ed"><title>GyanAI</title><link rel="stylesheet" href="/public/style.css"></head>
<body class="chat-body">
<aside id="drawer" class="drawer"><div class="drawer-head"><strong>☰ मेन्यू</strong><button id="closeDrawer" class="icon-btn">✕</button></div><button id="newChat" class="menu-item">＋ नई चैट</button><div class="drawer-label">हाल की चैट</div><div id="historyList"></div><a id="manageLink" class="menu-item hidden" href="#">⚙ AI Settings (Owner)</a></aside>
<div id="shade" class="shade hidden"></div>
<header class="chat-top"><button id="openDrawer" class="icon-btn" aria-label="मेन्यू">☰</button><div class="brand"><span class="spark">✦</span><span id="aiName">Gyan<span class="blue">AI</span></span></div><button id="moreBtn" class="icon-btn" aria-label="विकल्प">⋮</button><div id="moreMenu" class="more-menu hidden"><button id="historyBtn">चैट हिस्ट्री</button><button id="shareBtn">AI लिंक शेयर करें</button><a id="settingsShortcut" href="#" class="hidden">API Settings</a></div></header>
<main class="chat-main"><section id="welcomeCard" class="chat-welcome"><h1>नमस्कार! 👋</h1><p>आज मैं आपकी कैसे मदद कर सकता हूँ?</p><div class="creator-line">आपका AI · निर्माता: <strong id="creatorName">AI Creator</strong></div></section><section id="messages" class="messages"></section></main>
<form id="chatForm" class="composer"><textarea id="messageInput" rows="1" placeholder="यहाँ अपना सवाल लिखें..." required maxlength="6000"></textarea><button class="send-btn" id="sendBtn" aria-label="भेजें">➤</button></form>
<div id="toast" class="toast" role="status"></div><script src="/public/app.js"></script></body></html>
