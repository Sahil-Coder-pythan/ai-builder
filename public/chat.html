<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>GyanAI</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body class="chat-body">

  <!-- Left Drawer -->
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <strong>☰ मेन्यू</strong>
      <button id="closeDrawer" class="icon-btn">✕</button>
    </div>

    <button id="newChatBtn" class="menu-item">＋ नई चैट</button>

    <div class="drawer-label">हाल की चैट</div>
    <div id="historyList"></div>

    <!-- Owner Settings (Grok only) -->
    <div id="ownerSettings" class="owner-settings hidden">
      <div class="drawer-label">⚙ Grok API सेटिंग्स</div>
      <div class="settings-box">
        <label>Base URL (सिर्फ xAI / Grok)</label>
        <input type="text" id="setUrl" placeholder="https://api.x.ai/v1" autocomplete="off">
        <div id="urlSuggest" class="suggest-list"></div>

        <label>Model (Grok मॉडल)</label>
        <input type="text" id="setModel" placeholder="grok-4.7" autocomplete="off">
        <div id="modelSuggest" class="suggest-list"></div>

        <label>API Key</label>
        <input type="password" id="setKey" placeholder="xai-..." autocomplete="off">

        <div class="set-btns">
          <button type="button" id="testBtn" class="btn-secondary small">टेस्ट</button>
          <button type="button" id="saveSettingsBtn" class="btn-primary small">सेव करें</button>
        </div>
        <div id="settingsStatus" class="status small"></div>
        <p class="hint-tiny">सिर्फ Grok (xAI) API Key चलेगी।</p>
      </div>
    </div>
  </aside>
  <div id="shade" class="shade hidden"></div>

  <!-- Top Bar -->
  <header class="chat-top">
    <button id="openDrawer" class="icon-btn" aria-label="मेन्यू">☰</button>
    <div class="brand">
      <span class="spark">✦</span>
      <span>Gyan<span class="blue">AI</span></span>
    </div>
    <button id="moreBtn" class="icon-btn" aria-label="विकल्प">⋮</button>
    <div id="moreMenu" class="more-menu hidden">
      <button id="shareBtn">AI लिंक कॉपी करें</button>
      <button id="historyMenuBtn">चैट हिस्ट्री</button>
    </div>
  </header>

  <!-- Main Chat Area -->
  <main class="chat-main" id="chatMain">
    <section id="welcomeCard" class="chat-welcome">
      <h1>नमस्कार! 👋</h1>
      <p>आज मैं आपकी कैसे मदद कर सकता हूँ?</p>
      <div class="creator-line">
        निर्माता: <strong id="creatorName">—</strong>
      </div>
    </section>
    <section id="messages" class="messages"></section>
  </main>

  <!-- FIXED Composer at bottom -->
  <div class="composer-wrap">
    <form id="chatForm" class="composer">
      <textarea id="messageInput" rows="1" placeholder="GyanAI से कुछ भी पूछें..." maxlength="6000"></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="भेजें">➤</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/public/app.js"></script>
</body>
</html>
