<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Settings</title><link rel="stylesheet" href="/public/style.css"></head>
<body class="home-body"><header class="topbar"><a class="back-link" href="/">←</a><div class="brand">⚙ AI Settings</div></header><main class="home-wrap"><section class="panel"><h1>API सेटिंग</h1><p class="muted">यह पेज AI बनाने वाले owner के browser session में ही खुलेगा।</p><form id="settingsForm"><label>Base URL<input name="base_url" type="url" required></label><label>Model Name<input name="model" required></label><label>नई API Key <span class="muted">(बदलनी हो तभी भरें)</span><input name="api_key" type="password" autocomplete="off" placeholder="खाली छोड़ने पर पुरानी key रहेगी"></label><div class="two"><button type="button" class="secondary" id="testConnection">कनेक्शन टेस्ट</button><button class="primary" type="submit">सेव करें</button></div><div id="settingsStatus" class="status" role="status"></div></form></section></main><script src="/public/app.js"></script></body></html>
